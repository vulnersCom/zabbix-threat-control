# Vulners OS report - Windows inventory for zabbix-agent2.
#
# Install with the script next to this file (elevated PowerShell):
#   powershell -ExecutionPolicy Bypass -File install-agent.ps1
# It copies this file into the agent's include directory, adds an Include=
# line if none covers it, restarts the service and self-tests the keys.
#
# By hand: copy to the directory an active Include= in zabbix_agent2.conf
# points at (stock MSI: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\)
# and restart the "Zabbix Agent 2" service.
#
# Software is read from the registry Uninstall keys (both 64- and 32-bit views);
# installed updates come from Get-HotFix. No arbitrary system.run is enabled -
# only these fixed keys are exposed to the server.
#
# vulners.win.software -> v4/audit/smart (raw "Name Version" strings)
# vulners.win.kb       -> v3/audit/kb (installed KB identifiers)
#
# Get-HotFix (WMI) is slow and routinely exceeds the 3s default check timeout,
# surfacing as "Timeout occurred while gathering data" on the server. The
# provisioned items set a 30s per-item timeout (Zabbix 7.0+ passes it to the
# agent); the line below raises the agent-side limit to match. It applies to
# the whole agent, not just these keys - that is deliberate and is what the
# installer manages with -Timeout.
Timeout=30

UserParameter=vulners.os,powershell -NoProfile -NonInteractive -Command "(Get-CimInstance Win32_OperatingSystem).Caption"
UserParameter=vulners.version,powershell -NoProfile -NonInteractive -Command "(Get-CimInstance Win32_OperatingSystem).Version"
UserParameter=vulners.win.software,powershell -NoProfile -NonInteractive -Command "$k='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'; Get-ItemProperty $k -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName } | ForEach-Object { ('{0} {1}' -f $_.DisplayName, $_.DisplayVersion).Trim() }"
UserParameter=vulners.win.kb,powershell -NoProfile -NonInteractive -Command "Get-HotFix | ForEach-Object { $_.HotFixID }"
