# Vulners OS report — Linux inventory for zabbix-agent2.
#
# Install: copy to /etc/zabbix/zabbix_agent2.d/vulners.conf and restart the agent.
#   cp vulners.conf /etc/zabbix/zabbix_agent2.d/ && systemctl restart zabbix-agent2
#
# These are non-flexible UserParameters (no [*]), so `$1`, `$2` are passed to the
# shell verbatim (Zabbix only substitutes positional args for flexible keys).
# No arbitrary system.run is enabled: the server can only invoke these fixed keys.

UserParameter=vulners.os,. /etc/os-release 2>/dev/null; echo "$ID"
UserParameter=vulners.version,. /etc/os-release 2>/dev/null; echo "$VERSION_ID"
UserParameter=vulners.arch,uname -m

# Native package listing per package manager, matching the format Vulners expects:
#   dpkg : "<package> <version> <arch>"   (installed/hold only)
#   rpm  : full NVRA from `rpm -qa` (old kernels excluded, running kernel kept)
#   apk  : "<package>-<version>"
UserParameter=vulners.packages,if command -v dpkg-query >/dev/null 2>&1; then dpkg-query -W -f='${Status} ${Package} ${Version} ${Architecture}\n' | awk '($1=="install"||$1=="hold")&&($2=="ok"){print $4" "$5" "$6}'; elif command -v rpm >/dev/null 2>&1; then rpm -qa | grep -v '^kernel-'; rpm -qa | grep "^kernel.*$(uname -r)"; elif command -v apk >/dev/null 2>&1; then apk info -v; fi

# Remediation (optional): enqueue a package for upgrade. Flexible key, so Zabbix
# substitutes $1 with the package name; with UnsafeUserParameters=0 (default) the
# agent rejects shell-metacharacters in $1, so this is not an RCE vector.
#
# zabbix-agent2 kills any process a UserParameter backgrounds as soon as the check
# returns, so the upgrade CANNOT run here directly. Instead we append the package
# to a spool file that the host-side worker (deploy/agent/linux/vulners-fix-worker.sh,
# run by root cron) picks up, upgrades, and logs. See docs/adr/0001-remediation-mechanism.md.
#
# Verify on the host: `cat /var/lib/zabbix/vulners-fix.queue` (pending) and
# `tail -f /var/log/vulners-fix.log` (worker START/END rc=… per package).
UserParameter=vulners.fix[*],Q=${VULNERS_FIX_QUEUE:-/var/lib/zabbix/vulners-fix.queue}; printf '%s\n' '$1' >> "$Q" && echo queued || echo error
