# Minimal zabbix-agent2 config for the stand agent (built from ubuntu:24.04).
# Values are baked in (no stock image entrypoint here). LogType=console sends
# logs to the container's stdout.
PidFile=/run/zabbix/zabbix_agent2.pid
ControlSocket=/run/zabbix/agent.sock
LogType=console

# Passive allowlist: the server polls inventory; ztc needs access for fix
# (vulners.fix[...]). The whole compose network is allowed here; in production
# list the ztc host explicitly.
Server=zabbix-server,0.0.0.0/0
ServerActive=zabbix-server
Hostname=Zabbix server

Include=/etc/zabbix/zabbix_agent2.d/*.conf
